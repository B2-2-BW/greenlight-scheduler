spring.application.name: greenlight-scheduler
spring.profiles.active: local

server:
  port: 27070
  url: ${SERVER_URL}

springdoc:
  swagger-ui:
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: -1
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /**

spring:
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_DEV_HOST:127.0.0.1}
      port: ${REDIS_DEV_PORT:6379}
      password: ${REDIS_PASSWORD}
      cluster:
        max-redirects: 5
        nodes: ${REDIS_CLUSTER_NODES:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          time-between-eviction-runs: 300000

logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml
  level:
    root: INFO
    com.winten: DEBUG

influxdb:
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG}
  bucket: ${INFLUXDB_BUCKET}

redis:
  key-prefix: ${REDIS_KEY_PREFIX}
  connection-type: ${REDIS_CONNECTION_TYPE:standalone}

scheduler:
  delays:
    WAITING_TO_READY: 1
    METRIC: 3
    REMOVE_EXPIRED: 3

room:
  # WAITING/ENTERED heartbeat가 이 시간 동안 갱신되지 않으면 만료로 처리
  heartbeat-timeout: 60s

---

spring.config.activate.on-profile: local

---

spring.config.activate.on-profile: dev

---

spring.config.activate.on-profile: live

logging:
  level:
    root: ERROR
    com.winten: ERROR
    com.winten.greenlight.scheduler: ERROR
    org.springframework.data.redis: ERROR